<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1a253d" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#00f5ff" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: 2px;
      fill: #ffffff;
    }
    .title-role {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 21px;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: url(#accent-cyan);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
      letter-spacing: 0.8px;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.4; transform: scale(0.95); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="400" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1000" cy="80" r="180" fill="#7000ff" fill-opacity="0.15" filter="url(#glow-cyan)" />
  <circle cx="200" cy="350" r="150" fill="#00f5ff" fill-opacity="0.12" filter="url(#glow-cyan)" />
  <circle cx="950" cy="320" r="140" fill="#ff007a" fill-opacity="0.1" filter="url(#glow-cyan)" />

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="398" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Top Status Indicator -->
  <g transform="translate(60, 45)">
    <rect width="260" height="30" rx="15" fill="#0c192c" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="15" r="5" fill="#00f5ff" class="pulse-dot" />
    <circle cx="18" cy="15" r="9" fill="none" stroke="#00f5ff" stroke-opacity="0.5" />
    <text x="35" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">ENTERPRISE CLOUD &amp; AI</text>
  </g>

  <!-- Metric Badges Top Right -->
  <g transform="translate(850, 40)">
    <rect width="290" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981">● SYSTEM METRICS</text>
    <text x="160" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9ca3af">99.99% RESILIENT</text>
  </g>

  <!-- Header Main Titles -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" class="title-name">RUSHIKESH BONDE</text>
    <text x="0" y="38" class="title-role">Senior Cloud &amp; DevSecOps Architect ❖ AI Platform Engineer</text>
    <text x="0" y="70" class="subtitle">Architecting Zero-Trust Multi-Cloud Landing Zones, Autonomous Agentic SRE &amp; Enterprise RAG Systems</text>
    <text x="0" y="92" class="subtitle">Automating 100+ Enterprise Workload Migrations with Policy-as-Code &amp; FinOps Governance</text>
  </g>

  <!-- Glowing Visual Node Tech Graphics Right Side -->
  <g transform="translate(930, 160)">
    <!-- Tech Network Graphic -->
    <path d="M 0 50 L 60 10 L 140 10 L 200 50 L 140 90 L 60 90 Z" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="0" cy="50" r="5" fill="#00f5ff" filter="url(#glow-soft)" />
    <circle cx="60" cy="10" r="4" fill="#7000ff" filter="url(#glow-soft)" />
    <circle cx="140" cy="10" r="5" fill="#00f5ff" filter="url(#glow-soft)" />
    <circle cx="200" cy="50" r="6" fill="#ff007a" filter="url(#glow-soft)" />
    <circle cx="140" cy="90" r="4" fill="#00f5ff" filter="url(#glow-soft)" />
    <circle cx="60" cy="90" r="5" fill="#7000ff" filter="url(#glow-soft)" />
    <circle cx="100" cy="50" r="14" fill="#0f172a" stroke="#00f5ff" stroke-width="2" />
    <text x="100" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#38bdf8">AI</text>

    <!-- Data lines -->
    <line x1="0" y1="50" x2="100" y2="50" stroke="#00f5ff" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.7" />
    <line x1="200" y1="50" x2="100" y2="50" stroke="#ff007a" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.7" />
  </g>

  <!-- Capability Badges along Bottom -->
  <g transform="translate(60, 290)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="245" height="48" rx="10" fill="url(#badge-grad)" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="29" class="badge-text">🛡️ Zero-Trust DevSecOps</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(265, 0)">
      <rect width="255" height="48" rx="10" fill="url(#badge-grad)" stroke="#7000ff" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="29" class="badge-text">☁️ Azure CAF &amp; Hub-Spoke</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(540, 0)">
      <rect width="265" height="48" rx="10" fill="url(#badge-grad)" stroke="#ff007a" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="29" class="badge-text">🤖 Agentic AI &amp; MCP Servers</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(825, 0)">
      <rect width="255" height="48" rx="10" fill="url(#badge-grad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="29" class="badge-text">💰 FinOps &amp; Drift Pipelines</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accent-cyan)" />
</svg>
